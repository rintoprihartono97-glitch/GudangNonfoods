/* alias nama lama -> variabel tema baru, supaya seluruh CSS di bawah otomatis ikut berganti tema */
:root{--pink:var(--warna-utama);--pl:var(--warna-lembut);--pm:var(--warna-sedang);--ink:var(--warna-teks);

 --rd:var(--warna-bahaya);--sh:var(--warna-bayangan)}

body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}

/* Popup pemilih tema warna: 4 lingkaran min 44x44px, tema aktif bergaris tebal + centang */

.layout{display:flex;align-items:flex-start}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .tot{margin-left:auto;color:var(--mu)}
.sbox{position:relative;flex:1 1 240px}.sbox svg{position:absolute;left:12px;top:11px;color:var(--mu)}
.sbox input{width:100%;padding:10px 12px 10px 38px;background:var(--pl);border:1px solid var(--pm);border-radius:999px;outline:none}.sbox input:focus{border-color:var(--pink)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center;transition:.15s}
.btn.solid{background:var(--pink);color:#fff}.btn.line{background:#fff;color:var(--pink);border:1.5px solid var(--pink)}.btn:active{transform:scale(.96)}
.tw{overflow:auto;border-radius:10px;border:1px solid var(--ln);max-height:62vh}

.t td{padding:9px 12px;border-top:1px solid var(--ln);vertical-align:middle}
.t tbody tr[data-id]{cursor:pointer}.t tbody tr:hover{background:var(--warna-hover)}.t tbody tr:focus{outline:2px solid var(--pm);outline-offset:-2px}

a.nav,a.qa,a.stat,a.loc,a.logo{text-decoration:none}

.side{transition:width .25s ease,padding .25s ease}
.layout.sb-closed .side{width:0;padding:0;overflow:hidden}
#sbToggle.on{background:var(--pl);color:var(--pink);border-color:var(--pm)}
@media(max-width:900px){.layout.sb-closed .side{display:none}}

.sug a,.sug div{display:block}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}.fg label,.md label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}

.view{animation:fu .35s ease}.clicked svg{animation:pop .4s ease}

function sortCmp(key,dir){
 const m=dir==='desc'?-1:1;
 const get=i=>key==='name'?i.name:key==='principal'?i.principal:key==='kode'?i.kode:i.lokasi;
 return (a,b)=>{
  if(key==='stok')return (stk(a)-stk(b))*m;
  const x=String(get(a)||''),y=String(get(b)||'');
  if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1; // yang kosong selalu di bawah
  return x.localeCompare(y,'id',{numeric:true,sensitivity:'base'})*m; // abaikan huruf besar/kecil; kode tetap teks (0 depan aman)
 };
}
function theadSort(o,s){
 const th=(k,l,cls)=>{const on=s.key===k&&s.dir;return `<th class="sortable${cls?' '+cls:''}" data-sort="${k}" title="Klik untuk mengurutkan">${l}${on?`<span class="sort-ic">${s.dir==='asc'?'\u25B2':'\u25BC'}</span>`:''}</th>`};
 return `<tr>${th('principal','Prinsipal')}${th('kode','Kode')}${th('name','Nama Barang')}<th>Satuan</th>${th('lokasi','Lokasi')}${th('stok','Stok Saat Ini','num')}${o.edit?'<th></th>':''}</tr>`;
}
function attachRowKb(inp,tbody,idOf){
 let ki=-1;
 const rows=()=>[...tbody.children].filter(tr=>!tr.querySelector('td.empty'));
 const hl=()=>{const r=rows();r.forEach((tr,k)=>tr.classList.toggle('kb-on',k===ki));if(r[ki])r[ki].scrollIntoView({block:'nearest'})};
 new MutationObserver(()=>{ki=-1}).observe(tbody,{childList:true}); // daftar berubah -> sorotan hilang
 inp.addEventListener('keydown',e=>{
  const r=rows();if(!r.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ki=e.key==='ArrowDown'?Math.min(ki+1,r.length-1):Math.max(ki-1,0);hl()}
  else if((e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey))&&ki>=0){e.preventDefault();const id=idOf(r[ki],ki);if(id)go('detail',id)}
  else if(e.key==='Escape'&&ki>=0){ki=-1;hl()}
 });
}

   sections:[{head:['Prinsipal','Kode','Nama Barang','Satuan','Lokasi','Stok Saat Ini'],num:[5],body:cache.map(i=>[i.principal||'-',i.kode||'-',i.name,i.unit||'-',i.lokasi||'-',fmtN(stk(i))])}]});
 };
 if(!o.noex)$('lx').onclick=()=>xl(o.file||'daftar_barang','Daftar Barang',[['Prinsipal','Kode','Nama Barang','Satuan','Lokasi','Stok']].concat(cache.map(i=>[i.principal||'',i.kode||'',i.name,i.unit||'',i.lokasi||'',stk(i)])));
}
const stat=(ic_,lb,n,nt,go_,arg)=>`<a class="stat" href="${pathFor(go_,arg)}" data-go="${go_}"${arg?` data-arg="${arg}"`:''}><div class="sic">${ic(ic_,20)}</div><div class="lb">${lb}</div><div class="nv">${n}</div><div class="nt"><i></i>${nt}</div></a>`;
let FSM={periode:'30',principal:'',lokasi:'',q:'',limit:10};
const FSM_PERIODE=[['30','30 Hari'],['60','60 Hari'],['90','90 Hari'],['180','6 Bulan'],['365','1 Tahun'],['all','Semua']];
function kelDalamPeriode(i,cutoff){
 return (H[i.id]||[]).reduce((s,r)=>{
  if(!cutoff)return s+(+r.keluar||0);
  const d=new Date(toISO(r.tanggal));
  if(isNaN(d))return s;
  return s+(d>=cutoff?(+r.keluar||0):0);
 },0);
}
function fsmRows(list,warnaNol){
 if(!list.length)return '<tr><td colspan="7" class="empty">Tidak ada data</td></tr>';
 return list.map(({i,k})=>`<tr data-id="${i.id}" tabindex="0"><td>${esc(i.principal||'-')}</td><td>${esc(i.kode||'-')}</td><td><a class="rowlink" href="${pathFor('detail',i.id)}">${esc(i.name)}</a></td><td>${esc(i.unit||'-')}</td><td>${esc(i.lokasi||'-')}</td><td class="num" style="color:${k===0?warnaNol:'var(--pink)'};font-weight:700">${fmtN(k)}</td><td class="num">${fmtN(stk(i))}</td></tr>`).join('');
}
let FSM_LAST={fast:[],slow:[]};
function renderFSM(){
 const allItems=ALL();
 const cutoff=FSM.periode==='all'?null:new Date(Date.now()-Number(FSM.periode)*86400000);
 const q=norm(FSM.q.trim());
 const base=allItems.filter(i=>(!FSM.principal||i.principal===FSM.principal)&&(!FSM.lokasi||i.lokasi===FSM.lokasi)&&(!q||norm(i.name).includes(q)||norm(i.kode).includes(q)));
 const withKel=base.map(i=>({i,k:kelDalamPeriode(i,cutoff)}));
 const fast=withKel.filter(x=>x.k>0).sort((a,b)=>b.k-a.k).slice(0,FSM.limit);
 const slow=withKel.filter(x=>stk(x.i)>0).sort((a,b)=>a.k-b.k).slice(0,FSM.limit);
 FSM_LAST={fast,slow};
 $('fsmWrap').innerHTML=`<div class="fsm-grid">
  <div><div class="sec" style="margin-top:0">Barang Fast Moving <span style="font-weight:400;color:var(--mu);font-size:12px">(paling sering keluar)</span></div>
   <div class="card" style="margin-top:0"><div class="tw" style="max-height:420px"><table class="t"><thead><tr><th>Prinsipal</th><th>Kode</th><th>Nama Barang</th><th>Satuan</th><th>Lokasi</th><th class="num">Total Keluar</th><th class="num">Stok Saat Ini</th></tr></thead><tbody>${fsmRows(fast,'var(--mu)')}</tbody></table></div></div></div>
  <div><div class="sec" style="margin-top:0">Barang Slow Moving <span style="font-weight:400;color:var(--mu);font-size:12px">(jarang / tidak pernah keluar)</span></div>
   <div class="card" style="margin-top:0"><div class="tw" style="max-height:420px"><table class="t"><thead><tr><th>Prinsipal</th><th>Kode</th><th>Nama Barang</th><th>Satuan</th><th>Lokasi</th><th class="num">Total Keluar</th><th class="num">Stok Saat Ini</th></tr></thead><tbody>${fsmRows(slow,'#b8860b')}</tbody></table></div></div></div>
 </div>`;
}

 `<div class="sec">Analisis Pergerakan Barang</div>

    <div style="flex:1 1 90px"><label class="lb">Tampil</label><select id="fsmLimit" class="fs"><option value="10" ${FSM.limit==10?'selected':''}>10</option><option value="20" ${FSM.limit==20?'selected':''}>20</option><option value="50" ${FSM.limit==50?'selected':''}>50</option></select></div>
    <div class="sbox" style="align-self:flex-end">${ic('search',18)}<input id="fsmSearch" placeholder="Cari kode/nama barang..." value="${esc(FSM.q)}"></div>
    <button class="btn line" id="fsmReset" style="align-self:flex-end">Reset Filter</button>
    ${pdfBtn('fsmPdf','align-self:flex-end')}
   </div>
  </div>
  <div id="fsmWrap"></div>`;
 renderFSM();
 $('fsmPeriode').onchange=()=>{FSM.periode=$('fsmPeriode').value;renderFSM()};
 $('fsmPrincipal').onchange=()=>{FSM.principal=$('fsmPrincipal').value;renderFSM()};
 $('fsmLokasi').onchange=()=>{FSM.lokasi=$('fsmLokasi').value;renderFSM()};
 $('fsmLimit').onchange=()=>{FSM.limit=Number($('fsmLimit').value);renderFSM()};
 $('fsmSearch').oninput=()=>{FSM.q=$('fsmSearch').value;renderFSM()};
 $('fsmReset').onclick=()=>{FSM={periode:'30',principal:'',lokasi:'',q:'',limit:10};VIEWS.dashboard()};
 $('fsmPdf').onclick=()=>{
  const pl=(FSM_PERIODE.find(x=>x[0]===FSM.periode)||[0,FSM.periode])[1];
  const mk=list=>list.map(({i,k})=>[i.principal||'-',i.kode||'-',i.name,i.unit||'-',i.lokasi||'-',fmtN(k),fmtN(stk(i))]);
  const head=['Prinsipal','Kode','Nama Barang','Satuan','Lokasi','Total Keluar','Stok Saat Ini'];
  exportPDF({title:'Analisis Pergerakan Barang (Fast & Slow Moving)',base:'fast_slow_moving',
   meta:['Periode: '+pl+'   |   Prinsipal: '+(FSM.principal||'Semua')+'   |   Lokasi: '+(FSM.lokasi||'Semua')+'   |   Tampil: '+FSM.limit+(FSM.q?'   |   Cari: "'+FSM.q+'"':'')],
   sections:[{sub:'Barang Fast Moving (paling sering keluar)',head,num:[5,6],body:mk(FSM_LAST.fast)},{sub:'Barang Slow Moving (jarang / tidak pernah keluar)',head,num:[5,6],body:mk(FSM_LAST.slow)}]});
 };
};

VIEWS.backup=()=>{
 const totalH=Object.values(H).reduce((s,r)=>s+r.length,0);
 $('view').innerHTML=head('Backup / Restore Data','Simpan seluruh data (barang baru, edit, riwayat, hapus) ke file Excel, atau pulihkan dari file backup')+
 `<div class="card"><div class="sec" style="margin-top:0">Export (Backup)</div><p style="color:var(--mu);margin-top:-6px">Mengunduh <b>seluruh ${ALL().length} barang</b> (termasuk daftar barang bawaan aplikasi) beserta stok terkininya, plus rincian ${EX.length} barang baru, ${Object.keys(ED).length} barang diedit, ${DEL.length} barang dihapus, dan ${totalH} baris riwayat transaksi.</p><button class="btn solid" id="bkExport">${ic('download',16)} Export Backup (.xlsx)</button></div>
 <div class="card"><div class="sec" style="margin-top:0">Import (Restore)</div><p style="color:var(--mu);margin-top:-6px">Memulihkan data dari file backup .xlsx. <b>Ini akan menimpa seluruh data saat ini di perangkat ini.</b></p><input type="file" id="bkFile" accept=".xlsx" style="display:none"><button class="btn line" id="bkImport">${ic('upload',16)} Pilih File & Restore</button></div>`;
 $('bkExport').onclick=()=>{
  if(typeof XLSX==='undefined'){toast('Library Excel belum termuat');return}
  const wb=XLSX.utils.book_new();
  const allNow=ALL();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['id','principal','kode','name','unit','lokasi','stok_saat_ini']].concat(allNow.map(i=>[i.id,i.principal||'',i.kode||'',i.name,i.unit||'',i.lokasi||'',stk(i)]))),'AllItems');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['id','principal','kode','name','unit','lokasi','stock']].concat(EX.map(i=>[i.id,i.principal||'',i.kode||'',i.name,i.unit||'',i.lokasi||'',i.stock||0]))),'ExtraItems');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['id','name','kode','principal','unit','lokasi']].concat(Object.keys(ED).map(id=>[id,ED[id].name||'',ED[id].kode||'',ED[id].principal||'',ED[id].unit||'',ED[id].lokasi||'']))),'ItemEdits');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['id','deletedAt','manual']].concat(DEL.map(id=>[id,DL[id]||'',DLM[id]?1:0]))),'Deleted');
  const hrows=[];Object.keys(H).forEach(id=>H[id].forEach(r=>hrows.push([id,r.tanggal,r.keterangan,r.masuk,r.keluar,r.jumlah])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['itemId','tanggal','keterangan','masuk','keluar','jumlah']].concat(hrows)),'Histories');
  XLSX.writeFile(wb,'backup_gudang_'+todayStr().replace(/\//g,'-')+'.xlsx');
  toast('Backup berhasil diunduh');
 };
 $('bkImport').onclick=()=>$('bkFile').click();
 $('bkFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(!confirm('Restore akan MENIMPA seluruh data saat ini di perangkat ini (barang baru, edit, riwayat, hapus). Lanjutkan?')){e.target.value='';return}
  const reader=new FileReader();
  reader.onload=ev=>{
   try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const sheet=n=>{const s=wb.Sheets[n];return s?XLSX.utils.sheet_to_json(s,{header:1,defval:''}):[]};
    const exRows=sheet('ExtraItems').slice(1);
    EX=exRows.filter(r=>r[0]).map(r=>({id:String(r[0]),principal:r[1]||'',kode:r[2]||'',name:r[3]||'',unit:r[4]||'',lokasi:r[5]||'',stockRaw:String(r[6]||0),stock:Number(r[6])||0}));
    const edRows=sheet('ItemEdits').slice(1);
    ED={};edRows.forEach(r=>{if(r[0])ED[String(r[0])]={name:r[1]||'',kode:r[2]||'',principal:r[3]||'',unit:r[4]||'',lokasi:r[5]||''}});
    const delRows=sheet('Deleted').slice(1);
    DEL=[];DL={};DLM={};delRows.forEach(r=>{if(!r[0])return;const id=String(r[0]);DEL.push(id);if(r[1])DL[id]=r[1];if(r[2])DLM[id]=1});
    const hRows=sheet('Histories').slice(1);
    H={};hRows.forEach(r=>{if(!r[0])return;const id=String(r[0]);(H[id]=H[id]||[]).push({tanggal:r[1]||'',keterangan:r[2]||'',masuk:Number(r[3])||0,keluar:Number(r[4])||0,jumlah:Number(r[5])||0})});
    /* Baca sheet AllItems: tangkap baris yang ditambah/diedit manual oleh pengguna di Excel */
    const masterById={};MASTER.forEach(i=>masterById[i.id]=i);
    const knownIds=new Set(MASTER.map(i=>i.id).concat(EX.map(i=>i.id)));
    const allRows=sheet('AllItems').slice(1);
    let idx=0;
    allRows.forEach(r=>{
     const name=(r[3]||'').toString().trim();if(!name)return;
     let id=r[0]?String(r[0]):'';
     const principal=r[1]||'',kode=r[2]||'',unit=r[4]||'',lokasi=r[5]||'',stok=Number(r[6])||0;
     if(!id||!knownIds.has(id)){
      if(!id){idx++;id='imp'+Date.now()+idx}
      knownIds.add(id);
      EX.push({id,principal,kode,name,unit,lokasi,stockRaw:String(stok),stock:stok});
      if(!H[id])H[id]=[{tanggal:todayStr(),keterangan:'Stok Awal',masuk:stok>0?stok:0,keluar:0,jumlah:stok}];
     }else{
      const base=masterById[id]||EX.find(i=>i.id===id)||{};
      if(name!==base.name||kode!==(base.kode||'')||principal!==(base.principal||'')||unit!==(base.unit||'')||lokasi!==(base.lokasi||'')){
       ED[id]={name,kode,principal,unit,lokasi};
      }
     }
    });
    save('gudang_extra_items_v1',EX);save('gudang_item_edits_v1',ED);save('gudang_deleted_v1',DEL);save('gudang_deleted_log_v1',DL);save('gudang_deleted_manual_v1',DLM);save('gudang_histories_v1',H);
    toast('Data berhasil dipulihkan');e.target.value='';go('dashboard');
   }catch(err){toast('Gagal membaca file backup');e.target.value=''}
  };
  reader.readAsArrayBuffer(f);
 };
};

VIEWS.order=()=>{
 const ps=uniq(ALL().map(i=>i.principal));
 $('view').innerHTML=head('Order Barang','Pilih prinsipal, barang dan stok terkini tampil otomatis')+`<div class="card"><div class="bar"><div style="flex:1 1 220px"><label class="lb">Prinsipal</label><select id="op" class="fs"><option value="">-- Pilih Prinsipal --</option>${ps.map(p=>`<option ${p===ORD.p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="sbox" style="align-self:flex-end">${ic('search',18)}<input id="oq" placeholder="Cari nama barang..."></div><button class="btn line" id="ox" style="align-self:flex-end">${ic('download',16)} Export Excel</button>${pdfBtn('opdf','align-self:flex-end')}</div><div id="owarn"></div><div id="ot"></div><div class="bar" style="margin-top:14px"><span style="color:var(--mu);font-size:12.5px;align-self:center">No. Order berikutnya: <b id="onext"></b></span><button class="btn solid" id="osub">${ic('cart',16)} Buat Order</button></div></div>`;
 const list=()=>ALL().filter(i=>ORD.p&&i.principal===ORD.p);
 const paint=()=>{
  const t=norm($('oq').value.trim());const l=list().filter(i=>!t||norm(i.name).includes(t));
  $('ot').innerHTML=ORD.p?`<div class="tw"><table class="t"><thead><tr><th>Prinsipal</th><th>Kode</th><th>Nama Barang</th><th>Satuan</th><th class="num">Stok Terkini</th><th>Order</th></tr></thead><tbody>${l.map(i=>`<tr><td>${esc(i.principal)}</td><td>${esc(i.kode||'-')}</td><td>${esc(i.name)}</td><td>${esc(i.unit||'-')}</td><td class="num">${fmtN(stk(i))}</td><td><input type="number" min="0" class="oi" data-oid="${i.id}" value="${ORD.q[i.id]||''}" placeholder="0" style="width:80px;border-color:var(--ln)"></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Pilih prinsipal terlebih dahulu</p>';
  const belumSelesai=ORD.p&&ORDERS.some(o=>o.principal===ORD.p&&o.status==='aktif');
  $('owarn').innerHTML=belumSelesai?`<a href="${pathFor('orderlaporan')}" class="owarn-pulse" style="background:var(--pink);color:#fff;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none" data-go="orderlaporan">${ic('alert',18)} Cek riwayat order! Ada orderan yang belum selesai untuk prinsipal ini</a>`:'';
  const sb=$('osub');if(sb){sb.disabled=!!belumSelesai;sb.style.opacity=belumSelesai?.5:1;sb.style.cursor=belumSelesai?'not-allowed':'pointer';sb.title=belumSelesai?'Selesaikan order aktif prinsipal ini dulu sebelum membuat order baru':''}
 };
 $('op').onchange=()=>{ORD.p=$('op').value;paint()};$('oq').oninput=paint;paint();
 $('ot').addEventListener('input',e=>{const x=e.target.closest('.oi');if(x)ORD.q[x.dataset.oid]=Number(x.value)||0});
 $('ox').onclick=()=>{if(!ORD.p){toast('Pilih prinsipal dulu');return}xl('order_'+ORD.p.replace(/[^a-z0-9]/gi,'_'),'Order Barang',[['Prinsipal','Kode Barang','Nama Barang','Satuan','Stok Terkini','Order']].concat(list().map(i=>[i.principal,i.kode||'',i.name,i.unit||'',stk(i),ORD.q[i.id]||0])))};
 $('opdf').onclick=()=>{
  if(!ORD.p){toast('Gagal: pilih prinsipal dulu');return}
  const t=norm($('oq').value.trim()),l=list().filter(i=>!t||norm(i.name).includes(t));
  exportPDF({title:'Order Barang - '+ORD.p,base:'order_'+pdfSlug(ORD.p),
   meta:['Prinsipal: '+ORD.p+'   |   Pencarian: '+($('oq').value.trim()?'"'+$('oq').value.trim()+'"':'-')+'   |   Barang diorder: '+l.filter(i=>(ORD.q[i.id]||0)>0).length+' dari '+l.length],
   sections:[{head:['Prinsipal','Kode','Nama Barang','Satuan','Stok Terkini','Order'],num:[4,5],body:l.map(i=>[i.principal||'-',i.kode||'-',i.name,i.unit||'-',fmtN(stk(i)),ORD.q[i.id]||0])}]});
 };
 $('onext').textContent=peekDoc('ODR');
 $('osub').onclick=()=>{
  if(!ORD.p){toast('Pilih prinsipal dulu');return}
  if(ORDERS.some(o=>o.principal===ORD.p&&o.status==='aktif')){toast('Selesaikan dulu order aktif untuk prinsipal ini');return}
  const items=list().filter(i=>(ORD.q[i.id]||0)>0).map(i=>({itemId:i.id,kode:i.kode||'',name:i.name,unit:i.unit||'',qtyOrder:ORD.q[i.id],qtyDiterima:0,tanggalTerima:'',locked:false}));
  if(!items.length){toast('Isi jumlah Order minimal 1 barang');return}
  const no=nextOrderNo();
  ORDERS.push({no,principal:ORD.p,tanggalOrder:todayStr(),status:'aktif',items,createdAt:new Date().toISOString()});
  saveOrders();ORD.q={};
  toast('Order #'+no+' berhasil dibuat');
  go('orderlaporan');
 };
};
let OL={p:'',s:'',q:'',d:''}; // d = nomor order yang sedang dibuka (kosong = tampilan daftar)
let OLM={},OLMID=0; // baris barang manual yang belum disimpan, per nomor order
function statusItemBadge(order,it){
 if(order.status==='void')return `<span style="color:var(--warna-mute)">Dibatalkan</span>`;
 if(it.locked)return `<span style="color:var(--warna-sukses);font-weight:700">${ic('check',14)} Diterima</span>${it.manual?' <span class="olm-tag">Manual</span>':''}`;
 if((it.qtyDiterima||0)>0)return `<span style="color:#b8860b;font-weight:700">Sebagian</span>`;
 return `<span style="color:var(--warna-mute)">Menunggu</span>`;
}
function olStatus(o){
 if(o.status==='selesai')return ['Selesai','ok'];
 if(o.status==='void')return ['Void','na'];
 return o.items.some(i=>(i.qtyDiterima||0)>0)?['Sebagian','mid']:['Belum Datang','no'];
}
function olLastRecv(o){ // tanggal penerimaan terakhir; "-" bila belum ada barang datang
 let best='';
 o.items.forEach(i=>{if((i.qtyDiterima||0)>0&&i.tanggalTerima){const iso=toISO(i.tanggalTerima)||'';if(iso>best)best=iso}});
 return best?fmtDMMM(fromISO(best)):'-';
}
function renderOrderCard(o,withBack){
 const bisaEdit=o.status==='aktif';
 return `<div class="card" data-order="${o.no}">
  <div class="bar" style="margin-bottom:6px">
   <div><b>Order #${o.no}</b> &middot; ${esc(o.principal)} &middot; <span style="color:var(--mu)">${fmtDMMM(toDMY(o.tanggalOrder))||o.tanggalOrder}</span></div>
   <div class="tot" style="margin-left:auto">${o.status==='aktif'?'<span style="color:var(--warna-sukses);font-weight:700">Aktif</span>':o.status==='selesai'?'<span style="color:var(--pink);font-weight:700">Selesai</span>':'<span style="color:var(--warna-mute);font-weight:700">Dibatalkan</span>'}</div>
  </div>
  <div class="tw"><table class="t ol-det"><thead><tr><th class="ol-s">Kode</th><th class="ol-nm">Nama Barang</th><th class="ol-s">Satuan</th><th class="num ol-s">Qty Order</th><th class="num ol-s">Qty Diterima</th><th class="num ol-s">Sisa</th><th class="ol-s">Tgl Terima</th><th class="ol-s">Status</th></tr></thead>
  <tbody>${o.items.map((it,ix)=>{
   const diff=it.qtyOrder-(it.qtyDiterima||0);const sisa=diff>=0?diff:0;const lebih=diff<0?-diff:0;
   const editable=bisaEdit&&!it.locked;
   return `<tr data-ix="${ix}">
    <td class="ol-s">${esc(it.kode||'-')}</td><td class="ol-nm" title="${esc(it.name)}">${esc(it.name)}</td><td class="ol-s">${esc(it.unit||'-')}</td>
    <td class="num ol-s">${fmtN(it.qtyOrder)}</td>
    <td class="num ol-s">${editable?`<input type="number" min="0" class="olqty" data-ix="${ix}" value="${it.qtyDiterima||''}" placeholder="0" style="width:76px">`:fmtN(it.qtyDiterima||0)}</td>
    <td class="num ol-s">${it.manual?'-':(lebih>0?('<span style="color:var(--pink);font-weight:700">Lebih '+fmtN(lebih)+'</span>'):fmtN(sisa))}</td>
<td class="dc ol-s">${editable?`<input type="date" class="olti" data-ix="${ix}" value="${toISO(it.tanggalTerima)||''}" style="width:140px">`:esc(it.tanggalTerima||'-')}</td>
    <td class="ol-s">${statusItemBadge(o,it)}</td>
   </tr>`;
  }).join('')}${bisaEdit?(OLM[o.no]||[]).map(olmRowHtml).join(''):''}</tbody></table></div>
  ${withBack===true?`<div style="margin-top:10px"><button class="btn line" type="button" data-back>&larr; Kembali ke daftar</button></div>`:''}
  ${bisaEdit?`<div class="bar" style="margin-top:14px;justify-content:flex-start;gap:24px">
   <button class="btn line" data-void="${o.no}" style="border-color:var(--warna-bahaya);color:var(--warna-bahaya)">${ic('trash',15)} Void / Batal</button>
   <button class="btn line" type="button" data-addm="${o.no}" title="Tambah barang yang datang tetapi tidak ada di order ini">+ Tambah Barang</button>
   <button class="btn" data-save="${o.no}" style="background:#0b3d66;color:#fff;margin-left:auto">${ic('check',15)} Save</button>
   <button class="btn" data-finish="${o.no}" style="background:var(--warna-sukses);color:#fff">${ic('check',15)} Selesai</button>
  </div>`:''}
 </div>`;
}
const olmFilled=r=>!!(r.itemId||String(r.kode||'').trim()||String(r.nama||'').trim()||String(r.qty).trim()!=='');
function olmRowHtml(r){
 return `<tr class="olm-row${r._err?' io-bad':''}" data-mid="${r.id}">
  <td class="ol-s"><input data-mcol="kode" value="${esc(r.kode)}" placeholder="Kode" autocomplete="off" style="width:96px;border-color:var(--ln)"></td>
  <td class="ol-nm"><input data-mcol="nama" value="${esc(r.nama)}" placeholder="Ketik nama / kode barang" autocomplete="off" style="min-width:0;border-color:var(--ln)"></td>
  <td class="olm-sat ol-s">${esc(r.itemId?(r.unit||'-'):'-')}</td>
  <td class="num ol-s">0</td>
  <td class="num ol-s"><input type="number" min="0" step="any" data-mcol="qty" value="${esc(r.qty)}" placeholder="0" style="width:76px;border-color:var(--ln)"></td>
  <td class="num ol-s">-</td>
  <td class="dc ol-s"><input type="date" data-mcol="tgl" value="${esc(r.tgl||'')}" style="width:140px;border-color:var(--ln)"></td>
  <td class="ol-s" style="white-space:nowrap"><span class="olm-tag">Tambahan</span> <button class="ib del" type="button" data-mdel="${r.id}" title="Hapus baris">${ic('x',15)}</button><div class="io-msg">${esc(r._err||'')}</div></td>
 </tr>`;
}
function toDMY(s){return s} // tanggalOrder sudah tersimpan DD/MM/YYYY
VIEWS.orderlaporan=()=>{
 const ps=uniq(ORDERS.map(o=>o.principal));
 OL.d=''; // selalu mulai dari tampilan daftar
 $('view').innerHTML=head('Laporan Order','Pantau order per suplier: barang datang, sebagian, atau belum diterima')+
 `<div class="card" id="olbar"><div class="bar">
   <div style="flex:1 1 170px"><label class="lb">Prinsipal</label><select id="olp" class="fs"><option value="">Semua Prinsipal</option>${ps.map(p=>`<option ${p===OL.p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
   <div style="flex:1 1 150px"><label class="lb">Status</label><select id="ols" class="fs"><option value="" ${OL.s===''?'selected':''}>Semua</option><option value="aktif" ${OL.s==='aktif'?'selected':''}>Belum Selesai</option><option value="selesai" ${OL.s==='selesai'?'selected':''}>Selesai</option><option value="void" ${OL.s==='void'?'selected':''}>Void/Batal</option></select></div>
   <div class="sbox" style="align-self:flex-end">${ic('search',18)}<input id="olq" placeholder="Cari no order/kode/nama..." value="${esc(OL.q)}"></div>
   <button class="btn line" id="olx" style="align-self:flex-end">${ic('download',16)} Export Excel</button>
   ${pdfBtn('olpdf','align-self:flex-end')}
  </div><div class="tot" id="olc" style="margin-bottom:4px;color:var(--mu)"></div></div>
  <div id="olist"></div>`;
 let filtered=[];
 function paint(){
  const t=norm(OL.q.trim());
  filtered=ORDERS.filter(o=>(!OL.p||o.principal===OL.p)&&(!OL.s||o.status===OL.s)&&(!t||norm(o.no).includes(t)||norm(o.principal).includes(t)||o.items.some(it=>norm(it.name).includes(t)||norm(it.kode).includes(t))))
   .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||b.no.localeCompare(a.no)); // order terbaru di atas
  $('olc').textContent=filtered.length+' order';
  const dOrder=OL.d?ORDERS.find(x=>x.no===OL.d):null;
  if(OL.d&&!dOrder)OL.d='';
  $('olbar').style.display=dOrder?'none':'';
  if(dOrder){$('olist').innerHTML=renderOrderCard(dOrder,true);return}
  $('olist').innerHTML=filtered.length?`<div class="card" style="padding:6px 8px"><table class="t ol-list"><thead><tr><th>Tanggal Order</th><th>No Document</th><th>Nama Suplier</th><th>Tanggal Datang</th><th>Status</th></tr></thead><tbody>${filtered.map(o=>{
   const st=olStatus(o);
   return `<tr data-open="${esc(o.no)}" tabindex="0" title="Klik untuk melihat detail order"><td>${esc(fmtDMMM(toDMY(o.tanggalOrder))||o.tanggalOrder)}</td><td><b>${esc(o.no)}</b></td><td>${esc(o.principal)}</td><td>${esc(olLastRecv(o))}</td><td><span class="ol-badge ${st[1]}">${st[0]}</span></td></tr>`;
  }).join('')}</tbody></table></div>`:'<div class="card empty">Tidak ada order</div>';
 }
 $('olp').onchange=()=>{OL.p=$('olp').value;paint()};
 $('ols').onchange=()=>{OL.s=$('ols').value;paint()};
 $('olq').oninput=()=>{OL.q=$('olq').value;paint()};
 paint();
 $('olx').onclick=()=>{
  const rows=[['No Order','Tanggal Order','Prinsipal','Status Order','Kode','Nama Barang','Satuan','Qty Order','Qty Diterima','Sisa','Tgl Terima','Status Item']];
  filtered.forEach(o=>o.items.forEach(it=>rows.push([o.no,o.tanggalOrder,o.principal,o.status,it.kode||'',it.name,it.unit||'',it.qtyOrder,it.qtyDiterima||0,it.manual?'-':Math.max(0,it.qtyOrder-(it.qtyDiterima||0)),it.tanggalTerima||'',(it.locked?'Diterima':((it.qtyDiterima||0)>0?'Sebagian':'Menunggu'))+(it.manual?' (Manual)':'')])));
 xl('laporan_order','Laporan Order',rows);
 };
 $('olpdf').onclick=()=>{
  const body=[];
  filtered.forEach(o=>o.items.forEach(it=>{
   const rec=it.qtyDiterima||0,st=(it.locked?'Sudah datang':(rec>0?'Sebagian datang':'Belum datang'))+(it.manual?' (Manual)':'');
   body.push([o.no,o.tanggalOrder,o.principal,it.kode||'-',it.name,it.unit||'-',it.qtyOrder,rec,it.manual?'-':Math.max(0,it.qtyOrder-rec),st,o.status==='aktif'?'Aktif':(o.status==='selesai'?'Selesai':'Void')]);
  }));
  exportPDF({title:'Laporan Order',base:'laporan_order',
   meta:['Filter: Prinsipal = '+(OL.p||'Semua')+'   |   Status = '+(OL.s?({aktif:'Belum Selesai',selesai:'Selesai',void:'Void/Batal'})[OL.s]:'Semua')+(OL.q?'   |   Cari: "'+OL.q+'"':'')+'   |   '+filtered.length+' order'],
   sections:[{head:['No Order','Tgl Order','Prinsipal','Kode','Nama Barang','Satuan','Qty Order','Diterima','Sisa','Status Barang','Status Order'],num:[6,7,8],body}]});
 };

 /* ----- Tambah barang manual (barang datang di luar order) ----- */
 const msug=(()=>{const old=document.getElementById('olmSug');if(old)old.remove();const e=document.createElement('div');e.id='olmSug';e.className='io-sug';document.body.appendChild(e);return e})();
 const hideMs=()=>{msug.style.display='none'};IO_HIDE=hideMs;
 let MS={no:'',id:0,list:[],idx:-1};
 const orderOf=no=>ORDERS.find(x=>x.no===no);
 const cardOf=no=>document.querySelector('[data-order="'+no+'"]');
 const mrowOf=(no,id)=>(OLM[no]||[]).find(r=>r.id===id);
 const trOf=(no,id)=>{const c=cardOf(no);return c&&c.querySelector('tr[data-mid="'+id+'"]')};
 function flashExisting(o,itemId){
  const ix=o.items.findIndex(x=>x.itemId===itemId),c=cardOf(o.no),tr=c&&c.querySelector('tr[data-ix="'+ix+'"]');
  if(!tr)return;
  tr.classList.add('olm-flash');tr.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>tr.classList.remove('olm-flash'),1800);
  const q=tr.querySelector('.olqty');if(q){q.focus();q.select()}
 }
 function applyPick(o,r,it){
  if(o.items.some(x=>x.itemId===it.id)){toast('Barang sudah ada di order ini. Isi Qty Diterima di baris yang sudah ada.');flashExisting(o,it.id);return false}
  if((OLM[o.no]||[]).some(x=>x.id!==r.id&&x.itemId===it.id)){toast('Barang sudah ditambahkan di baris manual lain.');return false}
  r.itemId=it.id;r.kode=it.kode||'';r.nama=it.name;r.unit=it.unit||'';r._err='';
  const tr=trOf(o.no,r.id);
  if(tr){tr.querySelector('[data-mcol=kode]').value=r.kode;tr.querySelector('[data-mcol=nama]').value=r.nama;tr.querySelector('.olm-sat').textContent=r.unit||'-';tr.classList.remove('io-bad');tr.querySelector('.io-msg').textContent='';const q=tr.querySelector('[data-mcol=qty]');q.focus();q.select()}
  return true;
 }
 function showMs(no,id,el){
  const q=norm(el.value.trim());
  if(!q){hideMs();return}
  const ord=orderOf(no),prn=ord?ord.principal:'';
  const list=ALL().filter(x=>x.principal===prn&&(norm(x.name).includes(q)||norm(x.kode).includes(q))).slice(0,8); // hanya barang milik suplier order ini
  MS={no,id,list,idx:-1};
  msug.innerHTML=list.map((x,k)=>`<div data-k="${k}"><b>${esc(x.name)}</b><small>Kode ${esc(x.kode||'-')} \u00b7 ${esc(x.unit||'-')} \u00b7 ${esc(x.lokasi||'-')} \u00b7 Stok ${fmtN(stk(x))}</small></div>`).join('')+`<div data-k="${list.length}"><b>+ Barang baru</b><small>${list.length?'Belum ada di Stok Barang? Tambahkan di sini':'Tidak ada barang '+esc(prn||'suplier ini')+' yang cocok. Tambahkan sebagai barang baru'}</small></div>`;
  const rc=el.getBoundingClientRect();
  msug.style.left=Math.max(8,Math.min(rc.left,window.innerWidth-360))+'px';msug.style.top=(rc.bottom+2)+'px';msug.style.width=Math.max(rc.width,360)+'px';
  msug.style.display='block';
 }
 const hlMs=(sc=true)=>{[...msug.children].forEach((d,k)=>d.classList.toggle('on',k===MS.idx));const d=msug.children[MS.idx];if(d&&sc)d.scrollIntoView({block:'nearest'})};
 function newItemForm(o,r){
  const lok=uniq(ALL().map(i=>i.lokasi)).filter(Boolean);
  const m=modal(`<h3>+ Barang Baru</h3>
   <div class="fr"><label>Kode</label><input id="nbKode" value="${esc(r.kode)}" autocomplete="off"></div>
   <div class="fr"><label>Nama Barang</label><input id="nbNama" value="${esc(r.nama)}" autocomplete="off"></div>
   <div class="fr"><label>Satuan</label><input id="nbSat" autocomplete="off" placeholder="Mis. PCS / CTN"></div>
   <div class="fr"><label>Lokasi</label><input id="nbLok" list="nbLokL" autocomplete="off"><datalist id="nbLokL">${lok.map(l=>`<option value="${esc(l)}">`).join('')}</datalist></div>
   <div class="bar" style="margin:14px 0 0"><button class="btn solid" id="nbOk">Simpan dan Pilih</button><button class="btn line" id="nbNo">Batal</button></div>`);
  $('nbNo').onclick=m.close;
  $('nbOk').onclick=()=>{
   const nama=$('nbNama').value.trim();if(!nama){toast('Nama barang wajib diisi');$('nbNama').focus();return}
   const it={id:'usr'+Date.now(),principal:o.principal,kode:$('nbKode').value.trim(),name:nama,unit:$('nbSat').value.trim(),lokasi:$('nbLok').value.trim(),stockRaw:'0',stock:0};
   EX.push(it);save('gudang_extra_items_v1',EX);ensureH(it);
   m.close();applyPick(o,r,it);toast('Barang baru ditambahkan');
  };
 }
 function pickMs(k){
  const o=orderOf(MS.no),r=mrowOf(MS.no,MS.id);hideMs();if(!o||!r)return;
  if(k===MS.list.length){newItemForm(o,r);return}
  const it=MS.list[k];if(it)applyPick(o,r,it);
 }
 msug.addEventListener('mouseover',e=>{const d=e.target.closest('[data-k]');if(d&&MS.idx!==+d.dataset.k){MS.idx=+d.dataset.k;hlMs(false)}});
 msug.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-k]');if(d)pickMs(+d.dataset.k)});
 const onMInput=e=>{
  const t=e.target,col=t.dataset&&t.dataset.mcol;if(!col)return;
  const tr=t.closest('tr'),card=t.closest('[data-order]');if(!tr||!card)return;
  const no=card.dataset.order,id=+tr.dataset.mid,r=mrowOf(no,id);if(!r)return;
  if(col==='kode'||col==='nama'){
   if(e.type!=='input')return; // 'change' muncul setelah memilih saran; jangan melepas pilihan barang
   r[col]=t.value;
   if(r.itemId){r.itemId=null;r.unit='';tr.querySelector('.olm-sat').textContent='-'}
   showMs(no,id,t);
  }else if(col==='qty'){
   r.qty=t.value;
   if(r._err&&Number(r.qty)>0&&r.itemId){r._err='';tr.classList.remove('io-bad');tr.querySelector('.io-msg').textContent=''}
  }else if(col==='tgl'){r.tgl=t.value}
 };
 $('olist').addEventListener('input',onMInput);
 $('olist').addEventListener('change',onMInput);
 $('olist').addEventListener('focusout',e=>{
  const t=e.target,col=t.dataset&&t.dataset.mcol;if(col!=='kode'&&col!=='nama')return;
  hideMs();
  const tr=t.closest('tr'),card=t.closest('[data-order]');if(!tr||!card)return;
  const o=orderOf(card.dataset.order),r=o&&mrowOf(o.no,+tr.dataset.mid);if(!o||!r||r.itemId)return;
  const k=norm(r.kode.trim()),n=norm(r.nama.trim());if(!k&&!n)return;
  const pool=ALL().filter(x=>x.principal===o.principal);let m=[];
  if(k){m=pool.filter(x=>norm(x.kode)===k);if(m.length>1&&n)m=m.filter(x=>norm(x.name)===n)}else m=pool.filter(x=>norm(x.name)===n);
  if(m.length===1)applyPick(o,r,m[0]);
 });
 $('olist').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-open]')){e.preventDefault();OL.d=e.target.dataset.open;paint();window.scrollTo({top:0});return}
  const t=e.target,col=t.dataset&&t.dataset.mcol;if(!col)return;
  const open=msug.style.display==='block'&&(col==='kode'||col==='nama');
  if(open){
   const n=MS.list.length+1;
   if(e.key==='ArrowDown'){e.preventDefault();MS.idx=Math.min(MS.idx+1,n-1);hlMs();return}
   if(e.key==='ArrowUp'){e.preventDefault();MS.idx=Math.max(MS.idx-1,0);hlMs();return}
   if((e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey))&&MS.idx>=0){e.preventDefault();pickMs(MS.idx);return}
   if(e.key==='Escape'){hideMs();return}
  }
  if(e.key==='Enter'){
   e.preventDefault();hideMs();
   const nx={kode:'nama',nama:'qty',qty:'tgl'}[col];
   if(nx){const el=t.closest('tr').querySelector('[data-mcol="'+nx+'"]');if(el){el.focus();if(el.select)el.select()}}
  }
 });
 $('olist').addEventListener('click',e=>{
  const op=e.target.closest('[data-open]');
  if(op){OL.d=op.dataset.open;paint();window.scrollTo({top:0});return}
  if(e.target.closest('[data-back]')){OL.d='';hideMs();paint();window.scrollTo({top:0});return}
  const am=e.target.closest('[data-addm]');
  if(am){
   const o=orderOf(am.dataset.addm);if(!o||o.status!=='aktif')return;
   const r={id:++OLMID,itemId:null,kode:'',nama:'',unit:'',qty:'',tgl:toISO(todayStr()),_err:''};
   (OLM[o.no]=OLM[o.no]||[]).push(r);
   const c=cardOf(o.no);c.querySelector('tbody').insertAdjacentHTML('beforeend',olmRowHtml(r));
   const kEl=c.querySelector('tr[data-mid="'+r.id+'"] [data-mcol=kode]');kEl.focus();kEl.scrollIntoView({block:'center',behavior:'smooth'});
   return;
  }
  const md=e.target.closest('[data-mdel]');
  if(md){const card=md.closest('[data-order]'),no=card.dataset.order;OLM[no]=(OLM[no]||[]).filter(r=>r.id!==+md.dataset.mdel);md.closest('tr').remove();hideMs();return}
  const save=e.target.closest('[data-save]');
  if(save){
   const o=ORDERS.find(x=>x.no===save.dataset.save);if(!o||o.status!=='aktif')return;
   const card=save.closest('[data-order]');let adaDisimpan=false;
   o.items.forEach((it,ix)=>{
    if(it.locked)return;
    const qEl=card.querySelector(`tr[data-ix="${ix}"] .olqty`);
    if(!qEl)return;
    const total=Number(qEl.value)||0;
    const sebelum=it.qtyDiterima||0;
    const delta=total-sebelum;
    if(delta<=0)return; // tidak ada tambahan baru, cegah stok dobel bila Save diklik berulang
    const tglInp=card.querySelector(`tr[data-ix="${ix}"] .olti`);
    const tgl=tglInp&&tglInp.value?fromISO(tglInp.value):todayStr();
    const realItem=ALL().find(x=>x.id===it.itemId);
    if(!realItem){toast('Barang '+it.name+' tidak ditemukan di data');return}
    ensureH(realItem);
    H[it.itemId].push({tanggal:tgl,keterangan:'Barang Masuk Suplier',masuk:delta,keluar:0,jumlah:0,dok:o.no});
    recalc(it.itemId);
    it.qtyDiterima=total;
    it.tanggalTerima=tgl;
    if(it.qtyDiterima>=it.qtyOrder)it.locked=true;
    adaDisimpan=true;
   });
   /* --- barang manual (tambahan): masuk stok, tersimpan permanen di order, status hijau + label Manual --- */
   let manBad=0;
   const mrows=OLM[o.no]||[];
   if(mrows.length){
    const keep=[];
    mrows.forEach(r=>{
     if(!olmFilled(r))return; // baris kosong diabaikan
     const q=Number(r.qty);let err='';
     if(!r.itemId)err='Pilih barang dari daftar';
     else if(!(q>0))err='Qty Diterima harus lebih dari 0';
     else if(o.items.some(x=>x.itemId===r.itemId))err='Barang sudah ada di order ini';
     const real=(!err&&r.itemId)?ALL().find(x=>x.id===r.itemId):null;
     if(!err&&!real)err='Barang tidak ditemukan di data';
     if(err){r._err=err;manBad++;keep.push(r);return}
     const tgl=r.tgl?fromISO(r.tgl):todayStr();
     ensureH(real);
     H[real.id].push({tanggal:tgl,keterangan:'Barang Masuk Suplier #'+o.no+' (tambahan manual)',masuk:q,keluar:0,jumlah:0,dok:o.no});
     recalc(real.id);
     o.items.push({itemId:real.id,kode:real.kode||'',name:real.name,unit:real.unit||'',qtyOrder:0,qtyDiterima:q,tanggalTerima:tgl,locked:true,manual:true});
     adaDisimpan=true;
    });
    OLM[o.no]=keep;
   }
   saveOrders();
   if(adaDisimpan)toast('Tersimpan'+(manBad?', '+manBad+' baris manual belum valid':''));
   else toast(manBad?manBad+' baris manual belum valid (pilih barang dan isi Qty lebih dari 0)':'Tidak ada perubahan qty untuk disimpan');
   paint();
   return;
  }
  const fin=e.target.closest('[data-finish]');
  if(fin){
   const pendM=(OLM[fin.dataset.finish]||[]).filter(olmFilled).length;
   if(!confirm('Yakin order ini selesai? Item yang belum datang akan dianggap tidak jadi diterima.'+(pendM?'\n\nCatatan: '+pendM+' baris barang manual yang belum disimpan akan diabaikan.':'')))return;
   const o=ORDERS.find(x=>x.no===fin.dataset.finish);if(!o)return;
   delete OLM[o.no];
   o.status='selesai';o.finishedAt=new Date().toISOString();saveOrders();paint();toast('Order #'+o.no+' ditandai selesai');
   return;
  }
  const vd=e.target.closest('[data-void]');
  if(vd){
   if(!confirm('Yakin batalkan (void) order ini?'))return;
   const o=ORDERS.find(x=>x.no===vd.dataset.void);if(!o)return;
   delete OLM[o.no];
   o.status='void';o.finishedAt=new Date().toISOString();saveOrders();paint();toast('Order #'+o.no+' dibatalkan');
   return;
  }
 });
};

/* ================= STOCK OPNAME ================= */
function opnQtySistem(itemId){const it=ALL().find(x=>x.id===itemId);return it?stk(it):0}
function opnStatus(sesi,itemId){
 const rec=sesi.items[itemId];
 if(!rec||rec.qtyFisik==null)return 'belum';
 return rec.qtyFisik===opnQtySistem(itemId)?'sesuai':'selisih';
}
function opnBadge(st,diff){
 if(st==='sesuai')return `<span class="op-badge ok">${ic('check',14)} Sesuai</span>`;
 if(st==='selisih')return `<span class="op-badge bad">${ic('x',14)} ${diff>0?'+':''}${fmtN(diff)}</span>`;
 return `<span class="op-badge na">&ndash; Belum</span>`;
}
function opnCounts(sesi){
 const items=ALL();let dihitung=0,sesuai=0,selisih=0;
 items.forEach(it=>{const st=opnStatus(sesi,it.id);if(st!=='belum')dihitung++;if(st==='sesuai')sesuai++;if(st==='selisih')selisih++;});
 return {total:items.length,dihitung,sesuai,selisih};
}

    ${editable?`<button class="btn line" id="opnTmpl" style="align-self:flex-end">${ic('download',16)} Download Template</button>

    ${pdfBtn('opnPdf','align-self:flex-end')}

   </div>
   <div id="opnSugWrap" style="position:relative"><div class="sug" id="opnSug" style="top:0"></div></div>
   <div class="tw" style="max-height:60vh"><table class="t"><thead><tr><th>Kode</th><th>Nama Barang</th><th>Satuan</th><th>Lokasi</th><th class="num">Qty Sistem</th><th class="num">Qty Fisik</th><th class="num">Selisih</th><th>Status</th></tr></thead><tbody id="opnBody"></tbody></table></div>
  </div>`;
 function drawSummary(){
  const c=opnCounts(sesi);
  $('opnSum').innerHTML=`<div><div class="nv">${c.total}</div><div class="lb">Total Barang</div></div><div><div class="nv">${c.dihitung}</div><div class="lb">Sudah Dihitung</div></div><div><div class="nv" style="color:var(--warna-sukses)">${c.sesuai}</div><div class="lb">Sesuai</div></div><div><div class="nv" style="color:var(--warna-bahaya)">${c.selisih}</div><div class="lb">Selisih</div></div>`;
 }
 function rowHtml(it){
  const qs=stk(it);const rec=sesi.items[it.id];const qf=rec?rec.qtyFisik:null;
  const st=opnStatus(sesi,it.id);const diff=qf==null?0:qf-qs;
  return `<tr data-opid="${it.id}" class="op-${st}">
   <td>${esc(it.kode||'-')}</td><td>${esc(it.name)}</td><td>${esc(it.unit||'-')}</td><td>${esc(it.lokasi||'-')}</td>
   <td class="num">${fmtN(qs)}</td>
   <td class="num">${editable?`<input type="number" class="opn-qty" data-id="${it.id}" value="${qf==null?'':qf}" placeholder="-">`:(qf==null?'-':fmtN(qf))}</td>
   <td class="num opn-diff">${qf==null?'-':(diff>0?'+':'')+fmtN(diff)}</td>
   <td class="opn-status">${opnBadge(st,diff)}</td>
  </tr>`;
 }
 function drawTable(){
  const q=norm(FLT.q.trim());
  const items=ALL().filter(it=>{
   if(q&&!norm(it.name).includes(q)&&!norm(it.kode).includes(q))return false;
   if(FLT.s&&opnStatus(sesi,it.id)!==FLT.s)return false;
   if(FLT.l&&it.lokasi!==FLT.l)return false;
   return true;
  });
  $('opnBody').innerHTML=items.length?items.map(rowHtml).join(''):'<tr><td colspan="8" class="empty">Tidak ada barang yang cocok</td></tr>';
 }
 drawSummary();drawTable();
 $('opnF').onchange=()=>{FLT.s=$('opnF').value;drawTable()};
 $('opnL').onchange=()=>{FLT.l=$('opnL').value;drawTable()};
 const qInput=$('opnQ');const sugBox=$('opnSug');
 qInput.addEventListener('input',()=>{
  FLT.q=qInput.value;drawTable();
  const t=norm(qInput.value.trim());
  if(!t){sugBox.style.display='none';return}
  const m=ALL().filter(it=>norm(it.name).includes(t)||norm(it.kode).includes(t)).slice(0,15);

 });
 document.addEventListener('click',e=>{if(!sugBox.contains(e.target)&&e.target!==qInput)sugBox.style.display='none'});
 sugBox.addEventListener('click',e=>{
  const d=e.target.closest('[data-pick]');if(!d)return;

  if(tr){tr.scrollIntoView({block:'center',behavior:'smooth'});const inp=tr.querySelector('.opn-qty');if(inp){inp.focus();inp.select()}}
 });
 $('opnBody').addEventListener('input',e=>{
  const inp=e.target.closest('.opn-qty');if(!inp)return;
  const id=inp.dataset.id;const val=inp.value===''?null:Number(inp.value);
  if(val==null){delete sesi.items[id];}else{sesi.items[id]={qtyFisik:val,sumber:'manual',waktu:todayStr()};}
  saveOPN();
  const tr=inp.closest('tr');const st=opnStatus(sesi,id);const qs=opnQtySistem(id);const diff=val==null?0:val-qs;

 });
 if(editable){
  $('opnTmpl').onclick=opnTemplate;
  $('opnImp').onclick=()=>$('opnFile').click();
  $('opnFile').onchange=e=>{
   const f=e.target.files[0];if(!f)return;
   const reader=new FileReader();
   reader.onload=ev=>{
    try{
     const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
     const ws=wb.Sheets[wb.SheetNames[0]];
     const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
     if(!rows.length){toast('File kosong');e.target.value='';return}
     const head=rows[0].map(x=>norm(String(x)));
     const idx=(kw)=>head.findIndex(h=>h.includes(kw));
     const iKode=idx('kode'),iNama=idx('nama'),iSat=idx('satuan'),iQty=idx('qty');
     if(iKode<0&&iNama<0){toast('Format header tidak sesuai. Gunakan Download Template.');e.target.value='';return}
     const all=ALL();const byKode={};all.forEach(it=>{if(it.kode)byKode[norm(it.kode)]=it});
     let okCount=0,newCount=0,errRows=[];
     for(let r=1;r<rows.length;r++){
      const row=rows[r];if(!row||!row.length)continue;
      const kode=String(row[iKode]||'').trim();
      const nama=String(row[iNama]||'').trim();
      const sat=iSat>=0?String(row[iSat]||'').trim():'';
      const qtyRaw=row[iQty];
      if(!kode&&!nama){continue}
      const qty=Number(qtyRaw);
      if(qtyRaw===''||qtyRaw==null||isNaN(qty)){errRows.push('Baris '+(r+1)+': Qty tidak valid ('+esc(nama||kode)+')');continue}
      const found=kode?byKode[norm(kode)]:null;
      if(found){
       sesi.items[found.id]={qtyFisik:qty,sumber:'import',waktu:todayStr()};okCount++;
      }else{
       if(!nama){errRows.push('Baris '+(r+1)+': kode tidak ditemukan dan nama kosong');continue}
       const newItem={id:'imp'+Date.now()+r,principal:'',kode,name:nama,unit:sat,lokasi:'',stockRaw:String(qty),stock:qty};
       EX.push(newItem);byKode[norm(kode)]=newItem;
       sesi.items[newItem.id]={qtyFisik:qty,sumber:'import',waktu:todayStr()};
       okCount++;newCount++;
      }
     }
     save('gudang_extra_items_v1',EX);saveOPN();drawSummary();drawTable();
     e.target.value='';
     toast(okCount+' baris diimpor'+(newCount?', '+newCount+' barang baru ditambahkan':'')+(errRows.length?', '+errRows.length+' baris error':''));
     if(errRows.length){
      const m=modal('<h3>Baris Bermasalah</h3><div style="max-height:50vh;overflow:auto;font-size:13px;color:var(--warna-bahaya)">'+errRows.map(x=>'<div style="padding:4px 0;border-bottom:1px solid var(--ln)">'+x+'</div>').join('')+'</div><div class="bar" style="margin-top:14px"><button class="btn solid" id="opnErrClose">Tutup</button></div>');
      $('opnErrClose').onclick=m.close;
     }
    }catch(err){toast('Gagal membaca file Excel');e.target.value=''}
   };
   reader.readAsArrayBuffer(f);
  };
  $('opnFinish').onclick=()=>{
   const all=ALL();
   const selisihList=all.filter(it=>opnStatus(sesi,it.id)==='selisih');
   const body=`<h3>Selesaikan Opname</h3>
    <p style="color:var(--mu);font-size:13px">${selisihList.length} barang memiliki selisih dari ${opnCounts(sesi).dihitung} yang sudah dihitung.</p>
    <div style="max-height:260px;overflow:auto;margin:10px 0">${selisihList.length?selisihList.map(it=>{const qs=stk(it);const qf=sesi.items[it.id].qtyFisik;const d=qf-qs;return `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--ln)"><span>${esc(it.name)}</span><span style="color:var(--warna-bahaya);font-weight:700">${qs}&rarr;${qf} (${d>0?'+':''}${d})</span></div>`}).join(''):'<div style="color:var(--mu);font-size:13px">Tidak ada selisih.</div>'}</div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px"><input type="checkbox" id="opnAdjChk"> Sesuaikan stok sistem dengan hasil opname</label>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-top:6px"><input type="checkbox" id="opnAdminChk"> Saya berwenang (admin) melakukan penyesuaian stok ini</label>
    <div class="bar" style="margin-top:14px"><button class="btn solid" id="opnFinOk" style="background:var(--warna-sukses)">Selesaikan</button><button class="btn line" id="opnFinCancel">Batal</button></div>`;
   const m=modal(body);
   $('opnFinCancel').onclick=m.close;
   $('opnAdjChk').onchange=()=>{if($('opnAdjChk').checked&&!$('opnAdminChk').checked){toast('Centang konfirmasi admin untuk menyesuaikan stok');$('opnAdjChk').checked=false}};
   $('opnFinOk').onclick=()=>{
    const adjust=$('opnAdjChk').checked&&$('opnAdminChk').checked;
    if($('opnAdjChk').checked&&!$('opnAdminChk').checked){toast('Centang konfirmasi admin terlebih dahulu');return}

  rows=IOG.rows=[];for(let i=0;i<10;i++)rows.push(ioBlank());
  IOG.doc='';IOG.docAuto='';IOG.docTouched=false;$('ioDoc').value='';$('ioSum').innerHTML='';renderRows();
 };
 $('ioSave').onclick=()=>{
  POOL=ALL();const cur=new Map(POOL.map(i=>[i.id,i]));
  rows.forEach(r=>{
   if(r.itemId){const it=cur.get(r.itemId);if(it){r.stok=stk(it);r.lokasi=it.lokasi||''}else{r.itemId=null;r.stok=null}}
   if(!r.itemId&&!ioEmpty(r)){const m=ioFind(r);if(m)linkData(r,m)}
  });
  renderRows();
  const good=rows.filter(r=>!ioEmpty(r)&&!r._e),bad=rows.filter(r=>!ioEmpty(r)&&r._e);
  if(!good.length){toast(bad.length?'Perbaiki baris merah dulu':'Belum ada baris untuk disimpan');return}
  const nIn=good.filter(r=>r.jenis==='Masuk').length,nOut=good.length-nIn;
  const tgl=IOG.tgl?fromISO(IOG.tgl):todayStr();
  const m=modal(`<h3>Simpan Semua?</h3><p style="font-size:13.5px;margin:0">${nIn} barang masuk dan ${nOut} barang keluar akan disimpan untuk tanggal <b>${esc(tgl.replace(/\//g,'-'))}</b>${IOG.doc.trim()?' (No. Dokumen <b>'+esc(IOG.doc.trim())+'</b>)':''}.${bad.length?` <b style="color:var(--warna-bahaya)">${bad.length} baris bermasalah tidak ikut disimpan.</b>`:''}</p><div class="bar" style="margin:14px 0 0"><button class="btn solid" id="ioOk">Simpan</button><button class="btn line" id="ioNo">Batal</button></div>`);
  $('ioNo').onclick=m.close;
  $('ioOk').onclick=()=>{
   m.close();
   const s=getSession(),user=s?s.nama:'',doc=takeDoc('MK');
   const touched=new Set();let inC=0,outC=0,newC=0;
   good.forEach((r,gi)=>{
    let it=r.itemId?cur.get(r.itemId):null;
    if(!it){
     it={id:'usr'+Date.now()+'_'+gi,principal:'',kode:r.kode.trim(),name:r.nama.trim(),unit:(r.unitM||'').trim(),lokasi:'',stockRaw:'0',stock:0};
     EX.push(it);newC++;
    }
    ensureH(it);
    const q=Number(r.qty);
    let ket=r.ket==='Isi Sendiri'?r.ketc.trim():r.ket;
    if(doc)ket=ket?ket+' \u00b7 '+doc:doc;
    H[it.id].push({tanggal:tgl,keterangan:ket,masuk:r.jenis==='Masuk'?q:0,keluar:r.jenis==='Keluar'?q:0,jumlah:0,user:user,dok:doc});
    touched.add(it.id);
    if(r.jenis==='Masuk')inC++;else outC++;
   });
   if(newC)save('gudang_extra_items_v1',EX);
   touched.forEach(id=>recalc(id));
   POOL=ALL();const cur2=new Map(POOL.map(i=>[i.id,i]));
   const rest=rows.filter(r=>!ioEmpty(r)&&r._e);
   rest.forEach(r=>{if(r.itemId){const it=cur2.get(r.itemId);if(it)r.stok=stk(it)}});
   rows=IOG.rows=rest;
   if(!rows.length){for(let i=0;i<10;i++)rows.push(ioBlank())}else rows.push(ioBlank());
   IOG.doc='';IOG.docAuto='';IOG.docTouched=false;$('ioDoc').value='';
   renderRows();
   const msg='No. '+doc+': '+inC+' masuk, '+outC+' keluar tersimpan'+(newC?' ('+newC+' barang baru dibuat)':'')+(bad.length?', '+bad.length+' gagal':'');
   $('ioSum').innerHTML='<div class="io-sum">'+ic('check',16)+' '+esc(msg)+(bad.length?' \u2014 baris yang gagal tetap di grid untuk diperbaiki.':'')+'</div>';
   toast(msg);
  };
 };
 renderRows();
};

let LP={from:'',to:'',q:'',d:''},LE=null;
let ELOG=load('gudang_editlog_v1',[]); // riwayat perubahan transaksi Input Masuk/Keluar yang diedit
const LP_LABEL={mk:'Input Masuk/Keluar',op:'Opname',odr:'Order (Barang Masuk Suplier)',man:'Manual Kartu Stok',awal:'Stok Awal'};
const lpTotHtml=g=>[g.masuk?'<span class="lp-in">+'+fmtN(g.masuk)+'</span>':'',g.keluar?'<span class="lp-out">-'+fmtN(g.keluar)+'</span>':''].filter(Boolean).join(' / ');
const lpTotTxt=g=>[g.masuk?'+'+fmtN(g.masuk):'',g.keluar?'-'+fmtN(g.keluar):''].filter(Boolean).join(' / ');
/* Kelompokkan riwayat kartu stok menjadi dokumen transaksi saat ditampilkan (data lama tidak diubah) */
function lpBuild(){
 const m={};ALL().forEach(i=>m[i.id]=i);
 const groups=new Map();
 Object.keys(H).forEach(id=>{
  const it=m[id];if(!it)return;
  (H[id]||[]).forEach((x,idx)=>{
   const masuk=Number(x.masuk)||0,keluar=Number(x.keluar)||0;
   if(!masuk&&!keluar)return;
   const dok=histDok(id,x),key=dok||('row:'+id+':'+idx);
   let g=groups.get(key);
   if(!g){g={key,dok,tanggal:fmtDMY(x.tanggal),masuk:0,keluar:0,rows:[]};groups.set(key,g)}
   g.rows.push({item:it,row:x,id,idx,masuk,keluar});
   g.masuk+=masuk;g.keluar+=keluar;
   if(toISO(fmtDMY(x.tanggal))>toISO(g.tanggal))g.tanggal=fmtDMY(x.tanggal);
  });
 });
 const arr=[...groups.values()];
 arr.forEach(g=>{
  const d=g.dok;
  g.type=/^MK-/.test(d)?'mk':/^OP-/.test(d)?'op':/^(ODR-|\d{8}$)/.test(d)?'odr':(g.rows.every(r=>r.row.keterangan==='Stok Awal')?'awal':'man');
  g.label=LP_LABEL[g.type];
 });
 return arr.sort((a,b)=>toISO(b.tanggal).localeCompare(toISO(a.tanggal))||String(b.dok).localeCompare(String(a.dok)));
}
const lpKetOf=r=>{const b=histKet(r.row);return b||'-'};

 const hideS=()=>{sug.style.display='none'};IO_HIDE=hideS;
 const dpBox=(id,pid,val)=>`<div style="position:relative"><input id="${id}" class="fs" inputmode="numeric" maxlength="10" placeholder="dd-mm-yyyy" autocomplete="off" value="${isoToDash(val)}" style="padding-right:44px"><input type="date" id="${pid}" class="dp-over" aria-label="Pilih tanggal"><span class="dp-ic">${ic('cal',18)}</span></div>`;

 `<div class="card" id="lpbar"><div class="bar">

 };
 /* ---------- baris edit ---------- */
 function leRowHtml(r){
  const it=r.item||{},ex=!!r.existing;
  const jn=`<select class="le-j"><option${r.jenis==='Masuk'?' selected':''}>Masuk</option><option${r.jenis==='Keluar'?' selected':''}>Keluar</option></select>`; // jenis bisa diubah Masuk/Keluar

   <td><button class="ib del" type="button" data-edel="${r.rid}" title="Hapus item">${ic('x',15)}</button></td></tr>`;
 }
 let RID=0;
 function startEdit(g){
  LE={key:g.key,dok:g.dok,rows:g.rows.map(r=>{
   const b=histKet(r.row),pre=IO_KET.includes(b);
   return {rid:++RID,existing:r,item:r.item,itemId:r.id,jenis:r.keluar?'Keluar':'Masuk',qty:String(r.keluar||r.masuk),ket:pre?b:'Isi Sendiri',ketc:pre?'':b};
  })};
 }
 /* ---------- saran barang (autocomplete) untuk item baru ---------- */
 let SS={rid:0,list:[],idx:-1};
 const hl=(sc=true)=>{[...sug.children].forEach((d,k)=>d.classList.toggle('on',k===SS.idx));const d=sug.children[SS.idx];if(d&&sc)d.scrollIntoView({block:'nearest'})};
 function showS(rid,el){
  const q=norm(el.value.trim());if(!q){hideS();return}
  const list=ALL().filter(x=>norm(x.name).includes(q)||norm(x.kode).includes(q)).slice(0,8);

 }
 function pickS(k){

 }

 sug.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-k]');if(d)pickS(+d.dataset.k)});
 /* ---------- validasi + simpan edit: koreksi stok & Kartu Stok ---------- */
 const composeKet=(r,dok)=>{const k=r.ket==='Isi Sendiri'?String(r.ketc||'').trim():r.ket;return k&&dok?k+' \u00b7 '+dok:(k||dok)};
 function saveEdit(g){
  const act=LE.rows;
  if(!act.length){toast('Transaksi harus punya minimal 1 barang');return}
  for(const r of act){
   if(!r.itemId){toast('Pilih barang dari daftar untuk baris baru');return}
   if(!(Number(r.qty)>0)){toast('Qty harus lebih dari 0 ('+(r.item?r.item.name:'baris baru')+')');return}
  }
  const ids=new Set(g.rows.map(r=>r.id));act.forEach(r=>ids.add(r.itemId));

  for(const id of ids){

   let oldMin=Infinity,b=0;arr.forEach(x=>{b+=x.m-x.k;if(b<oldMin)oldMin=b});if(!arr.length)oldMin=0;
   g.rows.filter(r=>r.id===id).forEach(o=>{

/* ===== Ganti Tema Warna ===== */
const TEMA=[['pink','#E91356','Pink-Putih'],['merah','#D32F2F','Merah-Putih'],['biru','#1257AD','Biru-Putih'],['gelap','#121212','Gelap']];
const TEMA_METACOLOR={pink:'#f7f8fa',merah:'#faf7f7',biru:'#f6f8fb',gelap:'#121212'};
function temaAktif(){try{return localStorage.getItem('gudang_tema')||'pink'}catch(e){return 'pink'}}
function terapkanTema(id){
 document.documentElement.setAttribute('data-tema',id);
 try{localStorage.setItem('gudang_tema',id)}catch(e){}

 gambarPopupTema();
}

 const cur=temaAktif();
 $('tp').innerHTML=TEMA.map(([id,warna,label])=>{

 }).join('');
}

$('tb').onclick=e=>{e.stopPropagation();$('mp').classList.remove('open');$('tp').classList.toggle('open')};

$('mp').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;$('mp').classList.remove('open');if(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1)return;e.preventDefault();go(b.dataset.m)});
$('bk').onclick=back;$('logo').addEventListener('click',e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1)return;e.preventDefault();go('dashboard')});
document.addEventListener('click',e=>{if(!$('mp').contains(e.target)&&e.target.closest('#mb')==null)$('mp').classList.remove('open');if(!$('tp').contains(e.target)&&e.target.closest('#tb')==null)$('tp').classList.remove('open');if(!$('sg').contains(e.target)&&e.target!==$('q'))$('sg').style.display='none';const t=e.target.closest('.nav,.icon-btn,.qa,.stat,.btn,.loc');if(t){t.classList.remove('clicked');void t.offsetWidth;t.classList.add('clicked');setTimeout(()=>t.classList.remove('clicked'),450)}});
const q=$('q'),sg=$('sg');let si=-1,sm=[];
const pick=k=>{if(!sm[k])return;go('detail',sm[k].id);q.value='';sg.style.display='none'};
const clearSearchUI=()=>{q.value='';sg.style.display='none'};
q.addEventListener('input',()=>{const t=norm(q.value.trim());si=-1;if(!t){sg.style.display='none';return}sm=ALL().filter(i=>norm(i.name).includes(t)||norm(i.kode).includes(t)||norm(i.lokasi).includes(t)).slice(0,30);sg.innerHTML=sm.length?sm.map((i,k)=>`<a href="${pathFor('detail',i.id)}" data-k="${k}"><b>${esc(i.name)}</b><small>Stok: ${fmtN(stk(i))} · Kode: ${esc(i.kode||'-')} · ${esc(i.principal||'-')} · ${esc(i.unit||'-')} · ${esc(i.lokasi||'-')}</small></a>`).join(''):'<div>Barang tidak ditemukan</div>';sg.style.display='block'});
q.addEventListener('keydown',e=>{
 const r=sg.querySelectorAll('[data-k]');if(sg.style.display!=='block'||!r.length)return;
 const hl=(sc=true)=>{r.forEach((x,i)=>x.classList.toggle('on',i===si));if(sc&&r[si])r[si].scrollIntoView({block:'nearest'})};
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();si=e.key==='ArrowDown'?Math.min(si+1,r.length-1):Math.max(si-1,0);hl()}
 else if(e.key==='Enter'){e.preventDefault();pick(si>=0?si:0)}
 else if(e.key==='Tab'&&!e.shiftKey&&si>=0){e.preventDefault();pick(si)}
 else if(e.key==='Escape')sg.style.display='none';
});
sg.addEventListener('mouseover',e=>{const d=e.target.closest('[data-k]');if(!d)return;si=+d.dataset.k;sg.querySelectorAll('[data-k]').forEach((x,i)=>x.classList.toggle('on',i===si))});
sg.addEventListener('click',e=>{const d=e.target.closest('[data-k]');if(!d)return;if(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1){clearSearchUI();return}e.preventDefault();pick(+d.dataset.k)});

/* ================= LOGIN PIN: layar login, keypad, logout ================= */
let loginDigits='';
function updateWhoami(){
 const s=getSession();const el=$('whoami');
 if(el)el.textContent=s?(s.nama+(s.role==='admin'?' (Admin)':'')):'';
}
function loginLogoHtml(){
 return '<div class="login-logo"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></i><span>GUDANG NON FOODS</span></div>';
}
function renderLoginDots(){
 const el=$('loginDots');if(!el)return;
 el.innerHTML=Array.from({length:6}).map((_,i)=>'<span class="'+(i<loginDigits.length?'on':'')+'"></span>').join('');
}
function showLogin(){
 $('loginScreen').style.display='flex';
 document.querySelector('header.top').style.display='none';
 document.querySelector('.layout').style.display='none';
 loginDigits='';
 const keys=['1','2','3','4','5','6','7','8','9','C','0','\u232B'];
 $('loginScreen').innerHTML='<div class="login-card">'+loginLogoHtml()+'<div class="login-title">Masuk dengan PIN</div><div class="login-dots" id="loginDots"></div><div class="login-err" id="loginErr"></div><div class="login-pad" id="loginPad">'+keys.map(k=>'<button type="button" data-k="'+k+'" class="'+(k==='C'||k==='\u232B'?'wide':'')+'">'+k+'</button>').join('')+'<button type="button" class="btn solid login-submit" id="loginSubmit">Masuk</button></div></div>';
 renderLoginDots();
 const lo=getLockout();
 if(lo.until&&Date.now()<lo.until){const m=Math.ceil((lo.until-Date.now())/60000);$('loginErr').textContent='Terkunci. Coba lagi dalam '+m+' menit.'}
}
function hideLogin(){
 $('loginScreen').style.display='none';
 document.querySelector('header.top').style.display='';
 document.querySelector('.layout').style.display='';
}
async function tryLogin(){
 const lo=getLockout();
 if(lo.until&&Date.now()<lo.until){
  const m=Math.ceil((lo.until-Date.now())/60000);
  $('loginErr').textContent='Terkunci. Coba lagi dalam '+m+' menit.';
  loginDigits='';renderLoginDots();return;
 }
 if(loginDigits.length<4){$('loginErr').textContent='PIN minimal 4 digit';return}
 let matched=null;
 for(const u of USERS){
  if(!u.aktif)continue;
  const hh=await hashPin(loginDigits,u.salt);
  if(hh===u.pinHash){matched=u;break}
 }
 if(matched){
  saveLockout({count:0,until:0});
  setSession(matched);
  loginDigits='';
  renderedAuthKey=null;
  if(matched.mustChangePin){showForceChangePin(matched)}else{routeFromHash()}
 }else{
  const lo2=getLockout();
  lo2.count=(lo2.count||0)+1;
  if(lo2.count>=5){lo2.until=Date.now()+5*60*1000;lo2.count=0;$('loginErr').textContent='Terlalu banyak percobaan salah. Terkunci 5 menit.'}
  else{$('loginErr').textContent='PIN salah ('+(5-lo2.count)+' percobaan tersisa)'}
  saveLockout(lo2);
  loginDigits='';renderLoginDots();
 }
}
function showForceChangePin(user){
 $('loginScreen').innerHTML='<div class="login-card">'+loginLogoHtml()+'<div class="login-title">Selamat datang, '+esc(user.nama)+'. Wajib ganti PIN sebelum lanjut.</div><div class="fr"><label>PIN Baru (4-6 digit angka)</label><input id="fcpNew" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div><div class="fr"><label>Ulangi PIN Baru</label><input id="fcpConfirm" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div><div class="login-err" id="fcpErr"></div><button type="button" class="btn solid login-submit" id="fcpSave">Simpan PIN Baru</button></div>';
 $('fcpSave').onclick=async()=>{
  const p1=$('fcpNew').value.trim(),p2=$('fcpConfirm').value.trim();
  if(!/^\d{4,6}$/.test(p1)){$('fcpErr').textContent='PIN harus 4-6 digit angka';return}
  if(p1!==p2){$('fcpErr').textContent='Konfirmasi PIN tidak sama';return}
  for(const u of USERS){if(u.id!==user.id&&u.aktif){const hh=await hashPin(p1,u.salt);if(hh===u.pinHash){$('fcpErr').textContent='PIN sudah dipakai user lain';return}}}
  const salt=randSalt();
  user.pinHash=await hashPin(p1,salt);user.salt=salt;user.mustChangePin=false;
  saveUsers();
  PINLOG.push({waktu:new Date().toISOString(),oleh:user.nama,untuk:user.nama,aksi:'ubah PIN (wajib saat login pertama)'});savePinLog();
  routeFromHash();
 };
}
$('loginScreen').addEventListener('click',e=>{
 if(e.target.id==='loginSubmit'){tryLogin();return}
 const b=e.target.closest('[data-k]');if(!b)return;
 const k=b.dataset.k;
 if(k==='C')loginDigits='';
 else if(k==='\u232B')loginDigits=loginDigits.slice(0,-1);
 else if(loginDigits.length<6)loginDigits+=k;
 const er=$('loginErr');if(er&&!er.textContent.startsWith('Terkunci'))er.textContent='';
 renderLoginDots();
});
document.addEventListener('keydown',e=>{
 if($('loginScreen').style.display==='none'||!$('loginPad'))return;
 if(/^[0-9]$/.test(e.key)&&loginDigits.length<6){loginDigits+=e.key;renderLoginDots()}
 else if(e.key==='Backspace'){loginDigits=loginDigits.slice(0,-1);renderLoginDots()}
 else if(e.key==='Enter'){tryLogin()}
});
/* ===== Tombol buka/tutup sidebar (ingat pilihan; desktop dan HP punya pengaturan sendiri) ===== */
const sbMQ=window.matchMedia('(max-width:900px)');
const sbKey=()=>sbMQ.matches?'gudang_sb_m':'gudang_sb_d';
function applySb(){
 let closed=false;try{closed=localStorage.getItem(sbKey())==='closed'}catch(e){}
 document.querySelector('.layout').classList.toggle('sb-closed',closed);
 const b=$('sbToggle');b.setAttribute('aria-expanded',String(!closed));b.title=closed?'Buka menu samping':'Tutup menu samping';b.classList.toggle('on',closed);
}
$('sbToggle').onclick=()=>{
 const closed=!document.querySelector('.layout').classList.contains('sb-closed');
 try{localStorage.setItem(sbKey(),closed?'closed':'open')}catch(e){}
 applySb();
};
if(sbMQ.addEventListener)sbMQ.addEventListener('change',applySb);else sbMQ.addListener(applySb);
applySb();

 clearSession();renderedAuthKey=null;showLogin();
};

/* ================= KELOLA PIN (khusus admin) ================= */
VIEWS.kelolapin=()=>{
 const s=getSession();
 if(!s||s.role!=='admin'){$('view').innerHTML=head('Akses Ditolak','')+'<div class="card empty">Hanya admin yang dapat membuka menu Kelola PIN.</div>';return}
 $('view').innerHTML=head('Kelola PIN','Kelola pengguna dan PIN akses aplikasi')+
  `<div class="card"><button class="btn solid" id="upNew">${ic('plus',16)} Tambah User Baru</button></div>
   <div class="card" style="margin-top:12px"><div class="tw"><table class="t"><thead><tr><th>Nama</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="upBody"></tbody></table></div></div>
   <div class="sec">Riwayat Perubahan PIN</div>
   <div class="card" style="margin-top:0"><div class="tw" style="max-height:260px"><table class="t"><thead><tr><th>Waktu</th><th>Oleh</th><th>Untuk</th><th>Aksi</th></tr></thead><tbody id="plBody"></tbody></table></div></div>`;
 const adminCount=()=>USERS.filter(u=>u.role==='admin'&&u.aktif).length;
 function paint(){
  $('upBody').innerHTML=USERS.map(u=>`<tr><td>${esc(u.nama)}</td><td>${u.role==='admin'?'Admin':'User'}</td>
   <td>${u.aktif?'<span class="op-badge ok">'+ic('check',14)+' Aktif</span>':'<span class="op-badge na">Nonaktif</span>'}</td>
   <td style="white-space:nowrap;text-align:right"><button class="ib pen" data-reset="${u.id}" title="Ubah/Reset PIN">${ic('pencil',15)}</button> <button class="ib" data-toggle="${u.id}" title="${u.aktif?'Nonaktifkan':'Aktifkan'}">${ic(u.aktif?'x':'check',15)}</button> <button class="ib del" data-remove="${u.id}" title="Hapus">${ic('trash',15)}</button></td></tr>`).join('');
  $('plBody').innerHTML=[...PINLOG].reverse().slice(0,50).map(l=>`<tr><td>${esc(new Date(l.waktu).toLocaleString('id-ID'))}</td><td>${esc(l.oleh)}</td><td>${esc(l.untuk)}</td><td>${esc(l.aksi)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada perubahan PIN</td></tr>';
 }
 paint();
 $('upNew').onclick=()=>openUserForm(paint);
 $('upBody').addEventListener('click',e=>{
  const r=e.target.closest('[data-reset]');if(r){openPinForm(USERS.find(u=>u.id===r.dataset.reset),paint);return}
  const t=e.target.closest('[data-toggle]');
  if(t){
   const u=USERS.find(x=>x.id===t.dataset.toggle);
   if(u.aktif&&u.role==='admin'&&adminCount()<=1){toast('Tidak bisa menonaktifkan satu-satunya admin');return}
   u.aktif=!u.aktif;saveUsers();paint();return;
  }
  const d=e.target.closest('[data-remove]');
  if(d){
   const u=USERS.find(x=>x.id===d.dataset.remove);
   if(u.role==='admin'&&u.aktif&&adminCount()<=1){toast('Tidak bisa menghapus satu-satunya admin');return}
   if(!confirm('Hapus user '+u.nama+'?'))return;
   USERS=USERS.filter(x=>x.id!==u.id);saveUsers();paint();
  }
 });
};
function openUserForm(onDone){
 const m=modal(`<h3>Tambah User Baru</h3>
  <div class="fr"><label>Nama</label><input id="unName" type="text"></div>
  <div class="fr"><label>Role</label><select id="unRole"><option value="user">User</option><option value="admin">Admin</option></select></div>
  <div class="fr"><label>PIN Awal (4-6 digit angka)</label><input id="unPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
  <div class="fr"><label>Ulangi PIN</label><input id="unPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
  <div id="unErr" style="color:var(--warna-bahaya);font-size:12.5px;min-height:16px"></div>
  <div class="bar" style="margin:14px 0 0"><button class="btn solid" id="unSave">Simpan</button><button class="btn line" id="unCancel">Batal</button></div>`);
 $('unCancel').onclick=m.close;
 $('unSave').onclick=async()=>{
  const nama=$('unName').value.trim(),role=$('unRole').value,p1=$('unPin').value.trim(),p2=$('unPin2').value.trim();
  if(!nama){$('unErr').textContent='Nama wajib diisi';return}
  if(!/^\d{4,6}$/.test(p1)){$('unErr').textContent='PIN harus 4-6 digit angka';return}
  if(p1!==p2){$('unErr').textContent='Konfirmasi PIN tidak sama';return}
  for(const u of USERS){if(u.aktif){const hh=await hashPin(p1,u.salt);if(hh===u.pinHash){$('unErr').textContent='PIN sudah dipakai user lain';return}}}
  const salt=randSalt();const pinHash=await hashPin(p1,salt);
  USERS.push({id:'u'+Date.now(),nama,role,pinHash,salt,aktif:true,mustChangePin:false});saveUsers();
  const s=getSession();
  PINLOG.push({waktu:new Date().toISOString(),oleh:s?s.nama:'-',untuk:nama,aksi:'buat user baru'});savePinLog();
  m.close();toast('User ditambahkan');onDone();
 };
}
function openPinForm(user,onDone){
 if(!user)return;
 const m=modal(`<h3>Ubah / Reset PIN</h3><p style="color:var(--mu);font-size:13px;margin:0 0 10px">Untuk: <b>${esc(user.nama)}</b></p>
  <div class="fr"><label>PIN Baru (4-6 digit angka)</label><input id="rpPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
  <div class="fr"><label>Ulangi PIN Baru</label><input id="rpPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
  <div id="rpErr" style="color:var(--warna-bahaya);font-size:12.5px;min-height:16px"></div>
  <div class="bar" style="margin:14px 0 0"><button class="btn solid" id="rpSave">Simpan</button><button class="btn line" id="rpCancel">Batal</button></div>`);
 $('rpCancel').onclick=m.close;
 $('rpSave').onclick=async()=>{
  const p1=$('rpPin').value.trim(),p2=$('rpPin2').value.trim();
  if(!/^\d{4,6}$/.test(p1)){$('rpErr').textContent='PIN harus 4-6 digit angka';return}
  if(p1!==p2){$('rpErr').textContent='Konfirmasi PIN tidak sama';return}
  for(const u of USERS){if(u.id!==user.id&&u.aktif){const hh=await hashPin(p1,u.salt);if(hh===u.pinHash){$('rpErr').textContent='PIN sudah dipakai user lain';return}}}
  if(!confirm('Yakin ubah PIN untuk '+user.nama+'?'))return;
  const salt=randSalt();user.pinHash=await hashPin(p1,salt);user.salt=salt;user.mustChangePin=false;saveUsers();
  const s=getSession();
  PINLOG.push({waktu:new Date().toISOString(),oleh:s?s.nama:'-',untuk:user.nama,aksi:'ubah / reset PIN'});savePinLog();
  m.close();toast('PIN berhasil diubah');onDone();
 };
}
